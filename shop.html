<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CD Shop</title>
  <link rel="stylesheet" href="homepage.css" />
</head>
<body class="shop-page">

  <!-- HEADER -->
  <header class="shop-header">
    <h1>CD Shop</h1>
    <p>Featured artist visualizers & collectible discs</p>
  </header>

  <!-- SHOP CONTENT -->
  <main class="shop-content">

    <!-- LEFT PAGE -->
    <div class="page left">
      <div class="cd-grid">

        <div class="cd-slot" style="--offset-x: 10px; --offset-y: -2px;">
          <div class="cd" data-cd style="--art:url('images/CD/cd1.jpg')"></div>
          <div class="hub-ring"></div>
        </div>

        <div class="cd-slot" style="--offset-x: -8px; --offset-y: -2px;">
          <div class="cd" data-cd style="--art:url('images/CD/cd2.jpg')"></div>
          <div class="hub-ring"></div>
        </div>

        <div class="cd-slot" style="--offset-x: 9px; --offset-y: -25px;">
          <div class="cd" data-cd style="--art:url('images/CD/cd3.jpg')"></div>
          <div class="hub-ring"></div>
        </div>

        <div class="cd-slot" style="--offset-x: -9px; --offset-y: -25px;">
          <div class="cd" data-cd style="--art:url('images/CD/cd4.jpg')"></div>
          <div class="hub-ring"></div>
        </div>

      </div>
    </div>

    <!-- RIGHT PAGE -->
    <div class="page right">
      <div class="cd-grid">

        <div class="cd-slot" style="--offset-x: 10px; --offset-y: -2px;">
          <div class="cd" data-cd style="--art:url('images/CD/cd5.jpg')"></div>
          <div class="hub-ring"></div>
        </div>

        <div class="cd-slot" style="--offset-x: -8px; --offset-y: -2px;">
          <div class="cd" data-cd style="--art:url('images/CD/cd6.jpg')"></div>
          <div class="hub-ring"></div>
        </div>

        <div class="cd-slot" style="--offset-x: 9px; --offset-y: -25px;">
          <div class="cd" data-cd style="--art:url('images/CD/cd7.jpg')"></div>
          <div class="hub-ring"></div>
        </div>

        <div class="cd-slot" style="--offset-x: -9px; --offset-y: -25px;">
          <div class="cd" data-cd style="--art:url('images/CD/cd8.jpeg')"></div>
          <div class="hub-ring"></div>
        </div>

      </div>
    </div>

  </main>

  <!-- FOOTER -->
  <footer class="shop-footer">
    <button onclick="window.location.href='homepage.html'">
      ← Back to Home
    </button>
  </footer>

  <script src="script.js"></script>
  
</body>
</html>
